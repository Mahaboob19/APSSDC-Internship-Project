<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PlaceSync — Student Portal</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header>
    <h1>PlaceSync</h1>
    <nav>
      <a href="/index.html">Student</a>
      <a href="/admin.html">Admin</a>
    </nav>
  </header>

  <main>
    <section>
      <h2>Placement Drives</h2>
      <div id="companyList">Loading companies...</div>
    </section>

    <section>
      <h2>Track My Applications</h2>
      <div class="form-box">
        <label for="trackEmail">Enter your email</label>
        <form class="inline" id="trackForm">
          <input type="email" id="trackEmail" placeholder="you@example.com" required />
          <button type="submit">Track</button>
        </form>
      </div>
      <div id="applicationList"></div>
    </section>
  </main>

  <!-- Simple modal-less inline apply form, shown via JS -->
  <div id="applyBox" class="form-box" style="display:none;">
    <h3 id="applyCompanyName"></h3>
    <input type="hidden" id="applyCompanyId" />
    <label for="applyName">Your Name</label>
    <input type="text" id="applyName" required />
    <label for="applyEmail">Your Email</label>
    <input type="email" id="applyEmail" required />
    <button id="submitApplyBtn">Submit Application</button>
    <button class="secondary" id="cancelApplyBtn">Cancel</button>
    <p id="applyMessage"></p>
  </div>

  <script src="/js/main.js"></script>
</body>
</html>
